<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex" />
    <title>Thalco TV</title>
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <style>
      html, body { margin: 0; background: #000; }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">thalco<span>tv</span></div>
      <h1 class="page-title" id="title"></h1>
      <p class="intro" id="intro"></p>

      <section class="sheet" id="configure" hidden>
        <div class="step"><span class="pair-num">1</span><span class="section-label" id="configureStep"></span></div>
        <p class="sheet-message" id="configureText"></p>
        <div class="button-row"><a class="btn" id="configureLink" target="_blank" rel="noopener"></a></div>
      </section>

      <section class="sheet" id="form" hidden>
        <div class="step"><span class="pair-num" id="pasteNum">1</span><span class="section-label" id="pasteStep"></span></div>
        <textarea class="input-field" id="url" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" dir="ltr" placeholder="https://…/manifest.json"></textarea>
        <div class="button-row">
          <button class="btn" id="paste" type="button"></button>
          <button class="btn btn-primary" id="send" type="button"></button>
        </div>
        <div class="toast" id="status" role="status"></div>
      </section>

      <p class="note" id="note"></p>
    </main>
    <script type="module" src="/src/pair/main.ts"></script>
  </body>
</html>
